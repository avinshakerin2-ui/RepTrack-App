
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepTrack</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #100d19;
    color: white;
    font-family: Tahoma, sans-serif;
    padding: 20px;
}

.container {
    max-width: 650px;
    margin: auto;
}

header {
    text-align: center;
    padding: 25px 10px;
}

header h1 {
    color: #b58aff;
    font-size: 32px;
}

header p {
    color: #aaa;
    margin-top: 10px;
}

.card {
    background: #201a2d;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 18px;
}

h2 {
    color: #c4a2ff;
    font-size: 19px;
    margin-bottom: 15px;
}

input, select, button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    margin-top: 10px;
    font-size: 15px;
}

input, select {
    background: #332943;
    color: white;
    outline: none;
}

button {
    background: #8955d9;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #a276ee;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.stat {
    background: #302440;
    padding: 18px 8px;
    border-radius: 12px;
    text-align: center;
}

.stat strong {
    display: block;
    color: #c9aaff;
    font-size: 23px;
    margin-top: 10px;
}

.exercise {
    background: #332943;
    padding: 14px;
    border-radius: 10px;
    margin-top: 10px;
    line-height: 2;
}

.delete {
    background: #a53e55;
    padding: 8px;
}

.empty {
    color: #aaa;
    text-align: center;
    padding: 15px;
}

footer {
    text-align: center;
    color: #777;
    padding: 20px;
    font-size: 12px;
}
</style>
</head>

<body>
<div class="container">

<header>
<h1>RepTrack</h1>
<p>Track your training. Track your progress.</p>
</header>

<div class="card">
<h2>آمار تمرینات</h2>
<div class="stats">
<div class="stat">
تعداد تمرین‌ها
<strong id="count">0</strong>
</div>
<div class="stat">
مجموع جلسات
<strong id="sessions">0</strong>
</div>
</div>
</div>

<div class="card">
<h2>ثبت تمرین جدید</h2>

<input id="exerciseName" placeholder="نام تمرین">

<input id="exerciseAmount" type="number"
placeholder="تعداد ست یا مقدار تمرین">

<input id="exerciseDate" type="date">

<button onclick="addExercise()">ثبت تمرین</button>
</div>

<div class="card">
<h2>سوابق تمرینی</h2>
<div id="exerciseList">
<p class="empty">هنوز تمرینی ثبت نشده است.</p>
</div>
</div>

<div class="card">
<h2>اطلاعات بدنی</h2>

<input id="height" type="number" placeholder="قد (سانتی‌متر)">

<input id="weight" type="number" placeholder="وزن (کیلوگرم)">

<input id="arm" type="number" placeholder="اندازه بازو (سانتی‌متر)">

<button onclick="saveBody()">ذخیره اطلاعات</button>

<p id="bmiResult" style="margin-top:15px;color:#c9aaff"></p>
</div>

<div class="card">
<h2>تنظیمات زبان</h2>
<select id="language" onchange="changeLanguage()">
<option value="fa">فارسی</option>
<option value="en">English</option>
</select>
</div>

<footer>
RepTrack © 2026
</footer>

</div>

<script>
let exercises = JSON.parse(
    localStorage.getItem("exercises") || "[]"
);

function saveData() {
    localStorage.setItem(
        "exercises",
        JSON.stringify(exercises)
    );
}

function addExercise() {
    const name = document.getElementById("exerciseName").value;
    const amount = document.getElementById("exerciseAmount").value;
    const date = document.getElementById("exerciseDate").value;

    if (!name || !amount || !date || Number(amount) <= 0) {
        alert("لطفاً همه اطلاعات را درست وارد کن.");
        return;
    }

    exercises.push({
        name: name,
        amount: amount,
        date: date
    });

    saveData();
    renderExercises();

    document.getElementById("exerciseName").value = "";
    document.getElementById("exerciseAmount").value = "";
    document.getElementById("exerciseDate").value = "";
}

function deleteExercise(index) {
    if (confirm("این تمرین حذف شود؟")) {
        exercises.splice(index, 1);
        saveData();
        renderExercises();
    }
}

function renderExercises() {
    const list = document.getElementById("exerciseList");

    document.getElementById("count").textContent = exercises.length;
    document.getElementById("sessions").textContent =
        new Set(exercises.map(e => e.date)).size;

    if (exercises.length === 0) {
        list.innerHTML = '<p class="empty">هنوز تمرینی ثبت نشده است.</p>';
        return;
    }

    list.innerHTML = "";

    exercises.forEach((exercise, index) => {
        const div = document.createElement("div");
        div.className = "exercise";

        const title = document.createElement("strong");
        title.textContent = exercise.name;

        const details = document.createElement("p");
        details.textContent =
            "مقدار: " + exercise.amount + " | تاریخ: " + exercise.date;

        const button = document.createElement("button");
        button.className = "delete";
        button.textContent = "حذف تمرین";
        button.onclick = () => deleteExercise(index);

        div.append(title, details, button);
        list.appendChild(div);
    });
}

function saveBody() {
    const height = Number(document.getElementById("height").value);
    const weight = Number(document.getElementById("weight").value);
    const arm = document.getElementById("arm").value;

    if (height <= 0 || weight <= 0 || !arm || Number(arm) <= 0) {
        alert("اطلاعات را کامل و صحیح وارد کن.");
        return;
    }

    localStorage.setItem("bodyInfo", JSON.stringify({
        height, weight, arm
    }));

    const bmi = weight / ((height / 100) ** 2);

    document.getElementById("bmiResult").textContent =
        "BMI: " + bmi.toFixed(1);
}

function loadBody() {
    const data = JSON.parse(localStorage.getItem("bodyInfo") || "null");

    if (data) {
        document.getElementById("height").value = data.height;
        document.getElementById("weight").value = data.weight;
        document.getElementById("arm").value = data.arm;

        const bmi = data.weight / ((data.height / 100) ** 2);

        document.getElementById("bmiResult").textContent =
            "BMI: " + bmi.toFixed(1);
    }
}

function changeLanguage() {
    const lang = document.getElementById("language").value;

    if (lang === "en") {
        alert("English language selection is saved for a future update.");
    }
}

renderExercises();
loadBody();
</script>

</body>
</html>
